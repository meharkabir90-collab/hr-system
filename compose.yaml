services:

  backend:
    build:
      context: "./Employee Management System (Backend Development)/employee-management-backend"
    container_name: hr-backend-compose
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000

  frontend:
    build:
      context: "./EMS-Frontend/HR"
    container_name: hr-frontend-compose
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:5000/api"
    depends_on:
      - backend